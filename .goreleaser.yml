---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
archives:
  - id: archive
    name_template: "{{ .Binary }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
builds:
  - binary: external-dns-anexia-webhook
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    goarch:
      - amd64
      - arm64
      - arm
    goos:
      - darwin
      - windows
      - linux
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
    ldflags:
      - -X 'main.Version={{ .Tag }}'
      - -X 'main.Gitsha={{ .ShortCommit }}'
    main: ./cmd/webhook
source:
  enabled: true
signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - "--output-certificate=${certificate}"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: all
    output: true
sboms:
  - artifacts: archive
  - id: source
    artifacts: source
dockers_v2:
  - images:
      - "ghcr.io/anexia/k8s-external-dns-webhook"
    tags:
      # Tags that render empty are dropped, so latest is skipped on
      # prereleases. Keep at least one unconditional tag.
      - "{{ .Tag }}"
      - "{{ .FullCommit }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
# Keyless cosign signature for the published image. With artifacts unset
# this targets the dockers_v2 images.
docker_signs:
  - cmd: cosign
    args:
      - sign
      - --yes
      - "${artifact}@${digest}"
    output: true
# The changelog is generated by release-please, not GoReleaser.
changelog:
  disable: true
release:
  disable: false
  prerelease: auto
snapshot:
  version_template: "{{ .Tag }}-SNAPSHOT"
